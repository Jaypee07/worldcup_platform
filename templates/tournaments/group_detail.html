{% extends 'base.html' %}

{% block title %}Group {{ group.name }} — WC2026 Predictor{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Group {{ group.name }}</h1>
    <p>{{ group.teams.count }} teams competing.</p>
</div>

<div class="card">
    {% for team in group.teams.all %}
    <div style="display:flex; align-items:center; gap:0.75rem;
                padding:0.75rem; border-radius:8px; margin-bottom:0.5rem;
                background:var(--offwhite);">
        <span style="font-size:1.5rem;">{{ team.flag }}</span>
        <div>
            <div style="font-weight:700;">{{ team.name }}</div>
            <div style="font-size:0.75rem; color:var(--grey);">{{ team.code }}</div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
